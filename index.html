<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANDSHIFT -- Palm-powered highway riding</title>
    <meta
      name="description"
      content="HANDSHIFT is a cinematic palm-powered motorcycle run through a changing neon highway."
    />
    <meta name="theme-color" content="#071229" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game" data-game-state="playing" data-camera-state="idle">
      <div class="skyline" aria-hidden="true"></div>
      <canvas id="road" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <nav class="topbar" aria-label="Game controls">
        <h1>HAND<span>SHIFT</span></h1>
        <div class="icon-controls">
          <button id="camera" class="icon-button camera-button" aria-label="Enable palm tracking">
            <span class="camera-radar" aria-hidden="true"></span>
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M8 14v-2a2 2 0 0 1 4 0v-2a2 2 0 0 1 4 0V8a2 2 0 0 1 4 0v3a2 2 0 0 1 4 0v7c0 6-3 10-9 10-4 0-7-2-9-6l-2-5a2 2 0 0 1 4-1l1 2v-4Z" />
            </svg>
          </button>
          <button id="audio" class="icon-button" aria-label="Toggle sound">
            <svg class="sound-on" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M5 13h6l7-6v18l-7-6H5v-6Zm17-1c2 2 2 6 0 8m3-11c4 4 4 10 0 14" />
            </svg>
          </button>
        </div>
      </nav>

      <section class="hud" aria-label="Run status">
        <div class="score">
          <span>SCORE</span>
          <strong id="score">000000</strong>
        </div>
        <div class="time">
          <span>RUN</span>
          <strong id="time">3:30</strong>
        </div>
        <div class="speed">
          <strong id="speed">000</strong>
          <span>KM/H</span>
        </div>
        <div class="multiplier" id="multiplier">×1.0</div>
        <div class="run-progress" aria-hidden="true">
          <i id="run-progress-fill"></i>
        </div>
      </section>

      <div class="opening-signal" aria-hidden="true">
        <span class="steer-line"></span>
        <svg viewBox="0 0 64 64">
          <path d="M10 31h12l5-8h10l5 8h12M21 31l-5 10m27-10 5 10M27 23l5 8 5-8" />
        </svg>
      </div>

      <video id="camera-preview" muted playsinline aria-hidden="true"></video>
      <canvas id="hand-trace" width="220" height="150" aria-hidden="true"></canvas>
      <output id="reward" class="reward" aria-live="polite"></output>

      <section id="end-panel" class="end-panel" hidden aria-live="polite">
        <span id="ending">CRASHED</span>
        <strong id="final-score">000000</strong>
        <button id="restart" class="restart" aria-label="Restart run">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M25 11V5l-3 3a11 11 0 1 0 3 15M22 8h-6" />
          </svg>
        </button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
